version: '3.9'

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - zstudio

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
    networks:
      - zstudio
    # volumes:
    #   - ./tmp:/tmp

networks:
  zstudio:
    driver: bridge
