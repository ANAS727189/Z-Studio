     <script>
    window.addEventListener('error', function (ev) {
      const f = ev.filename || '';
      if (f.includes('lockdown-install.js') ||
          f.includes('lockdown-more.js')    ||
          f.includes('lockdown-run.js')) {
        ev.stopImmediatePropagation();
        ev.preventDefault();
      }
    }, /* useCapture = */ true);
  </script>
